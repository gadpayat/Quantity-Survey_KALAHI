let state=structuredClone(DATA);
const money=n=>'₱'+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const n=v=>Number(v)||0;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setVal(path,val){let a=path.split('.'),o=state;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a.at(-1)]=val;calcAll()}
function input(path,val,type='text'){return `<input class="inputcell" type="${type}" value="${esc(val)}" oninput="setVal('${path}',this.type==='number'?Number(this.value):this.value)">`}
function calcQTO(){
 const q=state.qto, segs=q.segments; let rows=[]; let step=q.length/segs; for(let i=0;i<=segs;i++){let st=i*step, len=i===0?0:step; rows.push({station:st,length:len,width:q.width,abcT:q.abcThickness,pccT:q.pccThickness,area:len*q.width,abcVol:len*q.width*q.abcThickness,pccVol:len*q.width*q.pccThickness})}
 q.rows=rows; q.area=rows.reduce((s,r)=>s+r.area,0); q.abcVol=rows.reduce((s,r)=>s+r.abcVol,0); q.pccArea=q.area; q.pccVol=rows.reduce((s,r)=>s+r.pccVol,0);
 state.payItems[2].qty=q.area; state.payItems[3].qty=q.area; state.payItems[4].qty=q.abcVol; state.payItems[5].qty=q.pccArea;
 // workbook material quantities driven by QTO
 let b=state.blocks[4]; if(b?.materials?.[0]) b.materials[0].qty=+(q.abcVol*1.15).toFixed(2);
 let p=state.blocks[5]; if(p?.materials?.length){let byName={};p.materials.forEach(x=>byName[x.name]=x); if(byName['Portland Cement (Type I)'])byName['Portland Cement (Type I)'].qty=+(q.pccArea*1.8).toFixed(0); if(byName['4.75mm Fine Aggregates '])byName['4.75mm Fine Aggregates '].qty=q.pccVol*0.5; if(byName['20mm Course Aggregates'])byName['20mm Course Aggregates'].qty=q.pccVol;}
}
function resourceCost(x){return n(x.crew||x.units)*n(x.days)*n(x.rate)}
function blockDirect(b){return b.materials.reduce((s,x)=>s+n(x.qty)*n(x.rate),0)+b.labor.reduce((s,x)=>s+resourceCost(x),0)+b.equipment.reduce((s,x)=>s+resourceCost(x),0)}
function blockCalc(b){let direct=blockDirect(b), exp=0; const base=direct; let e=b.expenses||[]; e.forEach(x=>x.amount=+(base*n(x.pct)/100).toFixed(2));exp=e.reduce((s,x)=>s+n(x.amount),0);return {direct,total:direct+exp,mat:b.materials.reduce((s,x)=>s+n(x.qty)*n(x.rate),0),labor:b.labor.reduce((s,x)=>s+resourceCost(x),0),equip:b.equipment.reduce((s,x)=>s+resourceCost(x),0)}}
function calcAll(){calcQTO(); state.blocks.forEach((b,i)=>{b.calc=blockCalc(b); b.unitCost=b.qty?n(b.calc.total)/n(b.qty):0;}); state.direct=state.blocks.reduce((s,b)=>s+n(b.calc.direct),0); state.indirect=state.blocks.reduce((s,b)=>s+n(b.calc.total-b.calc.direct),0); state.detailTotal=state.direct+state.indirect; state.adminTotal=state.admin.filter(r=>r.H!=null && !String(r.A||'').includes('Sub-Total')&&!String(r.A||'').includes('Total')).reduce((s,r)=>s+n(r.H),0); state.bondPremium=10507.5; state.ceap=40000; state.powTotal=state.detailTotal+state.adminTotal+state.bondPremium+state.ceap;}
function tab(id,label){return `<button class="tab" data-tab="${id}" onclick="showTab('${id}')">${label}</button>`}
const tabDefs=[['dash','📊 Dashboard'],['qto','📐 QTO'],['pay','📋 Pay Items'],['dce','🧮 Detailed Estimate'],['bom','🧱 BOM'],['fh','🚚 Freight Hardware'],['fa','🪨 Freight Aggregates'],['admin','🏛 Admin Cost'],['pow','📑 POW'],['boq','📦 BOQ'],['cpp','🛒 CPP'],['ws','📅 Work Schedule'],['man','👷 Manpower'],['equip','🚜 Equipment'],['cpm','⏱ CPM'],['bond','🔐 Bond'],['ref','📚 Parameters']];
function buildTabs(){document.getElementById('tabs').innerHTML=tabDefs.map(x=>tab(x[0],x[1])).join('')}

function dce(){calcAll();return panel('dce',`<div class="card"><h2>Detailed Cost Estimate — By Contract</h2><p class="small">Each pay item follows the workbook structure: Materials → Labor → Equipment → Direct Cost → Overhead → Contingency → Miscellaneous → Contractor's Profit → VAT → Total Cost → Total Unit Cost.</p></div>${state.blocks.map((b,i)=>blockHTML(b,i)).join('')}<div class="sticky-summary"><b>ALL PAY ITEMS:</b> Direct ${money(state.direct)} &nbsp; | &nbsp; Indirect ${money(state.indirect)} &nbsp; | &nbsp; Detailed Estimate Total ${money(state.detailTotal)}</div>`)}
function sourceSplit(amount){let gp=n(state.costRates.grantPct)/100,mp=n(state.costRates.mlguPct)/100;return [amount*gp,amount*mp]}
function blockHTML(b,i){let c=b.calc||blockCalc(b);let src=sourceSplit(c.total);return `<div class="card"><div class="sectionbar">${esc(b.title)} <span style="float:right">Qty: ${n(b.qty)} ${esc(b.unit)} • Total: ${money(c.total)}</span></div><div class="tablewrap"><table><thead><tr class="bluehead"><th>WBS and Particulars</th><th>Qty.</th><th>Unit</th><th>U-Cost / Rate</th><th>GRANT</th><th>MLGU Cash</th><th>BLGU Cash</th><th>Community Cash</th><th>Amount</th><th class="no-print">Action</th></tr></thead><tbody><tr class="yellowhead"><th colspan="10">A. Material Cost</th></tr>${b.materials.map((x,j)=>`<tr><td>${input(`blocks.${i}.materials.${j}.name`,x.name)}</td><td>${input(`blocks.${i}.materials.${j}.qty`,x.qty,'number')}</td><td>${input(`blocks.${i}.materials.${j}.unit`,x.unit)}</td><td>${input(`blocks.${i}.materials.${j}.rate`,x.rate,'number')}</td><td class="num">${money(n(x.qty)*n(x.rate)*n(state.costRates.grantPct)/100)}</td><td class="num">${money(n(x.qty)*n(x.rate)*n(state.costRates.mlguPct)/100)}</td><td class="num">₱0.00</td><td class="num">₱0.00</td><td class="num">${money(n(x.qty)*n(x.rate))}</td><td class="actions no-print"><button class="btn red" onclick="state.blocks[${i}].materials.splice(${j},1);refresh()">Del</button></td></tr>`).join('')}<tr class="subtotal"><td colspan="8" class="right">Sub-Total A</td><td class="num">${money(c.mat)}</td><td></td></tr><tr class="peachhead"><th colspan="10">B. Labor Cost</th></tr>${b.labor.map((x,j)=>`<tr><td>${input(`blocks.${i}.labor.${j}.name`,x.name)}</td><td>${input(`blocks.${i}.labor.${j}.crew`,x.crew,'number')}</td><td>${input(`blocks.${i}.labor.${j}.days`,x.days,'number')}</td><td>${input(`blocks.${i}.labor.${j}.rate`,x.rate,'number')}</td><td class="num">${money(resourceCost(x)*n(state.costRates.grantPct)/100)}</td><td class="num">${money(resourceCost(x)*n(state.costRates.mlguPct)/100)}</td><td class="num">₱0.00</td><td class="num">₱0.00</td><td class="num">${money(resourceCost(x))}</td><td class="actions no-print"><button class="btn red" onclick="state.blocks[${i}].labor.splice(${j},1);refresh()">Del</button></td></tr>`).join('')}<tr class="subtotal"><td colspan="8" class="right">Sub-Total B</td><td class="num">${money(c.labor)}</td><td></td></tr><tr class="greenhead"><th colspan="10">C. Equipment Cost</th></tr>${b.equipment.map((x,j)=>`<tr><td>${input(`blocks.${i}.equipment.${j}.name`,x.name)}</td><td>${input(`blocks.${i}.equipment.${j}.units`,x.units,'number')}</td><td>${input(`blocks.${i}.equipment.${j}.days`,x.days,'number')}</td><td>${input(`blocks.${i}.equipment.${j}.rate`,x.rate,'number')}</td><td class="num">${money(resourceCost(x)*n(state.costRates.grantPct)/100)}</td><td class="num">${money(resourceCost(x)*n(state.costRates.mlguPct)/100)}</td><td class="num">₱0.00</td><td class="num">₱0.00</td><td class="num">${money(resourceCost(x))}</td><td class="actions no-print"><button class="btn red" onclick="state.blocks[${i}].equipment.splice(${j},1);refresh()">Del</button></td></tr>`).join('')}<tr class="subtotal"><td colspan="8" class="right">Sub-Total C</td><td class="num">${money(c.equip)}</td><td></td></tr><tr class="grand"><td colspan="8">D. Grand Total / E. Direct Cost</td><td class="num">${money(c.direct)}</td><td></td></tr>${(b.expenses||[]).map((x,j)=>`<tr><td>${esc(x.name)}</td><td>${input(`blocks.${i}.expenses.${j}.pct`,x.pct,'number')}</td><td colspan="2">% of Direct Cost</td><td class="num">${money(n(x.amount)*n(state.costRates.grantPct)/100)}</td><td class="num">${money(n(x.amount)*n(state.costRates.mlguPct)/100)}</td><td colspan="2"></td><td class="num">${money(x.amount)}</td><td></td></tr>`).join('')}<tr class="total"><td colspan="8">K. Total Cost</td><td class="num">${money(c.total)}</td><td></td></tr><tr class="grand"><td colspan="8">J. Total Unit Cost</td><td class="num">${money(b.unitCost)}</td><td></td></tr></tbody></table></div></div>`}
function bom(){return panel('bom',`<div class="card"><h2>Bill of Materials</h2><div class="tablewrap"><table><thead class="yellowhead"><tr><th>Material / Item Description</th><th>Unit</th><th>Quantity</th><th>Unit Pick-up Cost</th><th>Unit Freight Cost</th><th>Total Unit Cost</th><th>Total Amount</th></tr></thead><tbody>${state.bom.map((r,i)=>{let desc=r.A,unit=r.B,qty=r.C,pick=r.D,fr=r.E,total=n(pick)+n(fr),amt=n(qty)*total;return `<tr><td>${esc(desc)}</td><td>${esc(unit)}</td><td>${n(qty)}</td><td class="num">${money(pick)}</td><td class="num">${money(fr)}</td><td class="num">${money(total)}</td><td class="num">${money(amt)}</td></tr>`}).join('')}</tbody></table></div><p class="note">Workbook rule: Total Unit Cost = Unit Pick-up Cost + Unit Freight Cost; Total Amount = Quantity × Total Unit Cost.</p></div>`)}
function freightHardware(){let r=state.freightHardware;return panel('fh',`<div class="card"><h2>Freight Cost — Hardware</h2><div class="tablewrap"><table><thead class="greenhead"><tr><th>Description</th><th>Unit</th><th>Qty.</th><th>Wt./Unit kg</th><th>Total Weight kg</th><th>Freight Cost/unit</th><th>Adopted Unit Cost</th></tr></thead><tbody>${r.filter(x=>x.A&&x.G!=null).map((x,i)=>`<tr><td>${esc(x.A)}</td><td>${esc(x.F)}</td><td class="num">${n(x.G)}</td><td class="num">${n(x.H).toFixed(4)}</td><td class="num">${n(x.I).toFixed(2)}</td><td class="num">${money(x.J)}</td><td class="num">${money(x.K)}</td></tr>`).join('')}</tbody></table></div><div class="metrics"><div class="metric"><small>Total Weight</small><strong>35,244.57 kg</strong></div><div class="metric"><small>Hauling Distance</small><strong>65 km</strong></div><div class="metric"><small>Trips</small><strong>15</strong></div><div class="metric"><small>Hours Required</small><strong>107 hr</strong></div><div class="metric"><small>Manual Hauling Cost</small><strong>${money(108926)}</strong></div><div class="metric"><small>Adopted Freight</small><strong>${money(3.5)} / kg</strong></div></div><div class="grid"><div class="field"><label>Elf Truck Rate/day</label><input value="6264" type="number" oninput="state.freightHardwareRateDay=Number(this.value);refresh()"></div><div class="field"><label>Loading/Unloading Laborers</label><input value="4" type="number"></div><div class="field"><label>Labor Rate/day</label><input value="470" type="number"></div><div class="field"><label>Adopted Freight/kg</label><input value="3.5" type="number"></div></div></div>`)}
function freightAgg(){return panel('fa',`<div class="card"><h2>Freight Cost — Aggregates</h2><div class="tablewrap"><table><thead class="greenhead"><tr><th>Material</th><th>Qty.</th><th>Unit</th><th>Unit Freight Cost</th><th>Extended</th></tr></thead><tbody>${state.freightAggregates.filter(x=>x.B&&x.I!=null).map(x=>`<tr><td>${esc(x.B)}</td><td class="num">${n(x.I)}</td><td>${esc(x.H)}</td><td class="num">${money(x.J)}</td><td class="num">${money(n(x.I)*n(x.J))}</td></tr>`).join('')}</tbody></table></div><div class="metrics"><div class="metric"><small>Total Quantity</small><strong>200.00 cu.m</strong></div><div class="metric"><small>Hauling Distance</small><strong>65 km</strong></div><div class="metric"><small>Dump Truck Capacity</small><strong>4.5 cu.m/trip</strong></div><div class="metric"><small>Trips</small><strong>45</strong></div><div class="metric"><small>Hours Required</small><strong>272.5 hr</strong></div><div class="metric"><small>Adopted Freight</small><strong>${money(1399)} / cu.m</strong></div></div></div>`)}
function admin(){return panel('admin',`<div class="card"><h2>Administrative Cost Derivation</h2><div class="tablewrap"><table><thead class="bluehead"><tr><th>Activity</th><th>Destination / Description</th><th>Fare / Allowance / Unit Price</th><th>Quantity</th><th>Unit</th><th>No. Transactions</th><th>Amount</th></tr></thead><tbody>${state.admin.filter(r=>r.B||r.A).map((r,i)=>{if(String(r.A||'').includes('Sub-Total')||String(r.A||'').includes('Total  Cost'))return `<tr class="subtotal"><td colspan="6">${esc(r.A)}</td><td class="num">${money(r.H)}</td></tr>`;if(!r.B&&!r.C)return `<tr><td colspan="7"><b>${esc(r.A)}</b></td></tr>`;return `<tr><td>${esc(r.A)}</td><td>${esc(r.B)}</td><td>${input(`admin.${i}.C`,r.C,'number')}</td><td>${input(`admin.${i}.D`,r.D,'number')}</td><td>${esc(r.E)}</td><td>${input(`admin.${i}.F`,r.F,'number')}</td><td class="num">${money(n(r.C)*n(r.D)*n(r.F))}</td></tr>`}).join('')}</tbody></table></div><div class="metric" style="margin-top:10px"><small>Total Administrative Cost (derived)</small><strong>${money(state.adminTotal)}</strong></div></div>`)}
function pow(){calcAll();let b=state.blocks;return panel('pow',`<div class="card"><h2>Program of Work — By Contract</h2>${projectFields()}<div class="grid" style="margin-top:8px"><div class="field"><label>PHYSICAL TARGET</label><input value="${n(state.qto.length)} m"></div><div class="field"><label>SUB-PROJECT DESCRIPTION</label><textarea>Construction of unreinforced Portland Cement Concrete Pavement (Length = ${n(state.qto.length).toFixed(2)} m; Width = ${n(state.qto.width).toFixed(2)} m; Thickness = ${n(state.qto.pccThickness*1000).toFixed(0)} mm)</textarea></div></div></div><div class="card"><div class="tablewrap"><table><thead class="bluehead"><tr><th>Item No.</th><th>Scope of Work (Direct Cost)</th><th>% Wt.</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>Material Cost</th><th>Labor Cost</th><th>Equipment Cost</th><th>Total</th></tr></thead><tbody>${b.map((x,i)=>{let c=x.calc;return `<tr><td>${esc(state.payItems[i].item)}</td><td>${esc(state.payItems[i].desc)}</td><td class="num">${(c.total/state.detailTotal*100).toFixed(3)}%</td><td class="num">${n(state.payItems[i].qty)}</td><td>${esc(state.payItems[i].unit)}</td><td class="num">${money(x.unitCost)}</td><td class="num">${money(c.mat)}</td><td class="num">${money(c.labor)}</td><td class="num">${money(c.equip)}</td><td class="num">${money(c.total)}</td></tr>`}).join('')}<tr class="total"><td colspan="9">TOTAL</td><td class="num">${money(state.detailTotal)}</td></tr></tbody></table></div></div><div class="card"><h3>Breakdown of Estimated Project Cost / Sources of Fund</h3>${powBreakdown()}</div>`)}
function powBreakdown(){let mat=state.blocks.reduce((s,b)=>s+b.calc.mat,0),lab=state.blocks.reduce((s,b)=>s+b.calc.labor,0),eq=state.blocks.reduce((s,b)=>s+b.calc.equip,0),direct=mat+lab+eq, ind=state.indirect;let gp=n(state.costRates.grantPct)/100,mp=n(state.costRates.mlguPct)/100;return `<div class="tablewrap"><table><thead class="grayhead"><tr><th>Cost Component</th><th>CDD Grant</th><th>Community</th><th>BLGU</th><th>MLGU</th><th>Other</th><th>Total Cost</th></tr></thead><tbody><tr><td>Material Cost</td><td class="num">${money(mat*gp)}</td><td>₱0.00</td><td>₱0.00</td><td class="num">${money(mat*mp)}</td><td>₱0.00</td><td class="num">${money(mat)}</td></tr><tr><td>Equipment Expenses</td><td class="num">${money(eq*gp)}</td><td>₱0.00</td><td>₱0.00</td><td class="num">${money(eq*mp)}</td><td>₱0.00</td><td class="num">${money(eq)}</td></tr><tr><td>Skilled / Unskilled Labor</td><td class="num">${money(lab*gp)}</td><td>₱0.00</td><td>₱0.00</td><td class="num">${money(lab*mp)}</td><td>₱0.00</td><td class="num">${money(lab)}</td></tr><tr class="subtotal"><td>Subtotal A — Direct Cost</td><td class="num">${money(direct*gp)}</td><td>₱0.00</td><td>₱0.00</td><td class="num">${money(direct*mp)}</td><td>₱0.00</td><td class="num">${money(direct)}</td></tr><tr><td>Indirect Cost</td><td class="num">${money(ind*gp)}</td><td>₱0.00</td><td class="num">${money(state.bondPremium)}</td><td class="num">${money(ind*mp)}</td><td class="num">${money(state.adminTotal+state.ceap)}</td><td class="num">${money(ind)}</td></tr><tr class="grand"><td>GRAND TOTAL</td><td class="num">${money((direct+ind)*gp)}</td><td>₱0.00</td><td class="num">${money(state.bondPremium)}</td><td class="num">${money((direct+ind)*mp)}</td><td class="num">${money(state.adminTotal+state.ceap)}</td><td class="num">${money(state.powTotal)}</td></tr></tbody></table></div>`}
function boq(){let rows=state.blocks.map((b,i)=>({item:state.payItems[i].item,desc:state.payItems[i].desc,qty:state.payItems[i].qty,unit:state.payItems[i].unit,rate:b.unitCost,total:b.unitCost*state.payItems[i].qty}));return panel('boq',`<div class="card"><h2>Bill of Quantities and Estimated Contract Cost</h2><div class="tablewrap"><table><thead class="bluehead"><tr><th>Item No.</th><th>Description</th><th>Quantity</th><th>Unit of Measurement</th><th>Rate/Unit</th><th>Estimated Direct Cost</th><th>Estimated Indirect Cost</th><th>Total Cost</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${esc(r.item)}</td><td>${esc(r.desc)}</td><td class="num">${n(r.qty)}</td><td>${esc(r.unit)}</td><td class="num">${money(r.rate)}</td><td class="num">${money(state.blocks[i].calc.direct)}</td><td class="num">${money(state.blocks[i].calc.total-state.blocks[i].calc.direct)}</td><td class="num">${money(r.total)}</td></tr>`).join('')}<tr class="subtotal"><td colspan="7">Sub-Total</td><td class="num">${money(state.detailTotal)}</td></tr></tbody></table></div><div class="card" style="margin-top:10px"><h3>Indirect / Administrative Items</h3><table><tbody>${[['Travelling Expenses',9830],['Meals and Snacks during CV Meeting',5000],['Miscellaneous Fee',1500],['Bond Premium',state.bondPremium],['Contingency',0]].map(x=>`<tr><td>${x[0]}</td><td class="num">${money(x[1])}</td></tr>`).join('')}<tr class="total"><td>GRAND TOTAL</td><td class="num">${money(1622559.25)}</td></tr></tbody></table></div></div>`)}
function cpp(){return panel('cpp',`<div class="card"><h2>Community Procurement Plan — CPP (New)</h2><div class="tablewrap"><table><thead class="yellowhead"><tr><th>Item / Package</th><th>Qty.</th><th>Unit</th><th>Unit Cost</th><th>Total Cost</th><th>Procurement Method</th><th>Start</th><th>NOA</th><th>Possible Contractors / Suppliers</th></tr></thead><tbody>${state.cpp.filter(r=>r.A||r.B).map(r=>{if(String(r.A||'').startsWith('Package No.')||String(r.A||'').startsWith('Estimated Budget'))return `<tr class="subtotal"><td colspan="9">${esc(r.A)} ${r.E?money(r.E):''}</td></tr>`;return `<tr><td>${esc(r.A)}</td><td class="num">${n(r.B)}</td><td>${esc(r.C)}</td><td class="num">${money(r.D)}</td><td class="num">${money(r.E)}</td><td>${esc(r.F)}</td><td>${r.G?esc(String(r.G).slice(0,10)):''}</td><td>${r.H?esc(String(r.H).slice(0,10)):''}</td><td>${esc(r.I)}</td></tr>`}).join('')}</tbody></table></div></div>`)}

function man(){return panel('man',`<div class="card"><h2>Manpower Schedule</h2><div class="tablewrap"><table><thead class="bluehead"><tr><th>Item No.</th><th>Work Activity</th><th>Position</th><th>Male</th><th>Female</th><th>Planned Man-Days</th><th>Duration</th><th>Weekly Deployment</th></tr></thead><tbody>${state.manpower.filter(r=>r.D||r.A).map(r=>`<tr><td>${esc(r.A)}</td><td>${esc(r.B)}</td><td>${esc(r.D)}</td><td class="num">${n(r.E)}</td><td class="num">${n(r.F)}</td><td class="num">${n(r.H)}</td><td class="num">${n(r.T)}</td><td>${['I','J','K','L','M','N','O','P'].map(c=>r[c]!=null?`W${c}`:'').filter(Boolean).join(' ')}</td></tr>`).join('')}</tbody></table></div><div class="metrics"><div class="metric"><small>Male</small><strong>${sumCol(state.manpower,'E')}</strong></div><div class="metric"><small>Female</small><strong>${sumCol(state.manpower,'F')}</strong></div><div class="metric"><small>Female %</small><strong>${((sumCol(state.manpower,'F')/(sumCol(state.manpower,'E')+sumCol(state.manpower,'F'))||0)*100).toFixed(2)}%</strong></div></div></div>`)}

function cpm(){return panel('cpm',`<div class="card"><h2>Critical Path Method</h2><div class="grid"><div class="field"><label>START DATE</label><input type="date" value="${String(state.project.startDate).slice(0,10)}" onchange="state.project.startDate=this.value;refresh()"></div><div class="field"><label>POW DURATION</label><input value="${n(state.project.duration)} days" readonly></div><div class="field"><label>CALCULATED NETWORK DURATION</label><input value="17.50 days" readonly></div></div></div><div class="card"><div class="tablewrap"><table><thead class="bluehead"><tr><th>WBS</th><th>Item #</th><th>Task</th><th>Duration (days)</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>Float</th></tr></thead><tbody>${state.cpm.map(r=>`<tr><td>${esc(r.A)}</td><td>${esc(r.B)}</td><td>${esc(r.C)}</td><td class="num">${n(r.I)}</td><td>${r.J?esc(String(r.J).slice(0,10)):''}</td><td>${r.K?esc(String(r.K).slice(0,10)):''}</td><td>${r.L?esc(String(r.L).slice(0,10)):''}</td><td>${r.M?esc(String(r.M).slice(0,10)):''}</td><td class="num">${n(r.N)}</td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:10px"><b>CPM interpretation:</b> Float = Latest Start − Earliest Start. The sample workbook identifies a calculated network duration of 17.50 days against a POW stated duration of 30.00 days.</div></div>`)}
function bond(){return panel('bond',`<div class="card"><h2>Bond Premium</h2><div class="two"><div><h3>Bond Premium Table</h3><div class="tablewrap"><table><thead class="yellowhead"><tr><th>Min Cash Accountability</th><th>Max Cash Accountability</th><th>Amount of Bond</th><th>Bond Premium</th></tr></thead><tbody>${state.bondPremium.map(r=>`<tr><td class="num">${money(r.A)}</td><td class="num">${money(r.B)}</td><td class="num">${money(r.C)}</td><td class="num">${money(r.D)}</td></tr>`).join('')}</tbody></table></div></div><div><h3>Bond Guide — Sample Calculation</h3><table><tr><td>Highest CPP package / Step 1</td><td class="num">${money(1104773.03)}</td></tr><tr><td>Computed cash accountability / Step 2</td><td class="num">${money(826025.875)}</td></tr><tr><td>First tranche / Step 3</td><td class="num">${money(1199616.6564)}</td></tr><tr class="total"><td>Final lowest accountability</td><td class="num">${money(826025.875)}</td></tr><tr class="grand"><td>Bond Premium per disbursing officer</td><td class="num">${money(5253.75)}</td></tr></table></div></div></div>`)}
function ref(){return panel('ref',`<div class="card"><h2>Workbook Parameter Map</h2><p>This application is based on the supplied workbook's estimating parameters and sample values. The principal linked sheets are represented below.</p><div class="tablewrap"><table><thead class="grayhead"><tr><th>Workbook Sheet</th><th>Web Module</th><th>Purpose / Parameters</th></tr></thead><tbody>${[['BOND PREMIUM','Bond','Cash-accountability ranges and bond premium'],['Bond Guide','Bond','Step 1–5 bond computation'],['Pay Items','Pay Items','Item code, description, quantity, unit'],['QTO','QTO','Station, length, width, depth/thickness, area, volume'],['Detail Estimate (By Contract)','DCE','Materials, labor, equipment, funding, indirect cost'],['POW (By Contract)','POW','Estimated cost of proposed work and sources of fund'],['BOM','BOM','Pick-up cost + freight cost = total unit cost'],['Freight Cost Hardware','Freight Hardware','Weight, hauling cycle, truck/labor, adopted freight/kg'],['Freight Cost Aggregates','Freight Aggregates','Quantity, truck capacity, trips, cycle time, adopted freight/cu.m'],['BOQ','BOQ','Rate/unit, estimated cost, administrative cost, bond, grand total'],['Admin Cost Deriv','Admin Cost','Travel, meals/snacks, miscellaneous and transaction counts'],['CPP (New)','CPP','Packages, procurement method, schedule, supplier options'],['WS-PPR','Work Schedule','Pay item weights and planned/actual deployment'],['Manpower Sched','Manpower','Male/female labor, man-days, deployment'],['Equipment Sched','Equipment','Equipment deployment by week'],['CPM','CPM','ES, EF, LS, LF and Float'],['CPP (Old)','CPP Old','Legacy procurement reference']].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div></div>`)}
function render(id){calcAll();let html={dash:dashboard,qto:qto,pay:pay,dce:dce,bom:bom,fh:freightHardware,fa:freightAgg,admin:admin,pow:pow,boq:boq,cpp:cpp,ws:ws,man:man,equip:equip,cpm:cpm,bond:bond,ref:ref}[id]();document.getElementById('panel-'+id).outerHTML=html;document.getElementById('panel-'+id).classList.add('active')}
function refresh(){let active=document.querySelector('.tab.active')?.dataset.tab||'dash';document.getElementById('panels').innerHTML=allPanels();showTab(active)}
function allPanels(){return [dashboard(),qto(),pay(),dce(),bom(),freightHardware(),freightAgg(),admin(),pow(),boq(),cpp(),ws(),man(),equip(),cpm(),bond(),ref()].join('')}
function saveState(){localStorage.setItem('KALAHI_QS_DCE_V4',JSON.stringify(state));alert('Estimate saved in this browser.');}
function loadState(){let s=localStorage.getItem('KALAHI_QS_DCE_V4');if(!s){alert('No saved estimate found.');return}state=JSON.parse(s);refresh()}
function resetState(){if(confirm('Restore the supplied sample workbook parameters?')){state=structuredClone(DATA);refresh()}}
function exportJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='KALAHI-Quantity-Survey-DCE-POW.json';a.click()}
function exportCSV(){let rows=[['PAY ITEM','DESCRIPTION','QTY','UNIT','DIRECT COST','TOTAL COST']];state.blocks.forEach((b,i)=>rows.push([state.payItems[i].item,state.payItems[i].desc,state.payItems[i].qty,state.payItems[i].unit,b.calc.direct,b.calc.total]));let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='DCE-POW-Summary.csv';a.click()}
buildTabs();document.getElementById('panels').innerHTML=allPanels();showTab('dash');
</script></body></html>
